# Copy to <name>.yaml and replace everything in <angle brackets>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <name>
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.home:2222/k8s/<project>.git
    targetRevision: main
    path: <path>
  destination:
    server: https://kubernetes.default.svc
    namespace: <namespace>
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
